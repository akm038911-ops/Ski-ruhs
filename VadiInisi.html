}
if (window.requestIdleCallback) requestIdleCallback(step, { timeout: 2000 });
else setTimeout(step, 350);
};
if (window.requestIdleCallback) requestIdleCallback(step, { timeout: 2000 });
else setTimeout(step, 350);
}

function applyAtmosphere(a, b, t) {
if (!scene) return;
if (scene.background && scene.background.isColor) {
scene.background.copy(a.bg).lerp(b.bg, t);
}
if (scene.fog) {
scene.fog.color.copy(a.fogColor).lerp(b.fogColor, t);
scene.fog.near = a.fogNear + (b.fogNear - a.fogNear) * t;
scene.fog.far = a.fogFar + (b.fogFar - a.fogFar) * t;
}
// Biome'a özel tone-mapping pozlaması: karlı bölgelerde beyaz patlamayı önler.
if (renderer && a.exposure !== undefined) {
renderer.toneMappingExposure = a.exposure + ((b.exposure !== undefined ? b.exposure : a.exposure) - a.exposure) * t;
}
// Biome'a özel aydınlatma harmanı: güneş + ortam ışığı yumuşakça geçer.
if (sunLight && a.sun) {
sunLight.color.copy(a.sun).lerp(b.sun, t);
sunLight.intensity = a.sunInt + (b.sunInt - a.sunInt) * t;
}
if (hemiLight && a.hemiSky) {
hemiLight.color.copy(a.hemiSky).lerp(b.hemiSky, t);
hemiLight.groundColor.copy(a.hemiGround).lerp(b.hemiGround, t);
hemiLight.intensity = a.hemiInt + (b.hemiInt - a.hemiInt) * t;
}
// Gökyüzü kubbesi: ufuk rengi sisle aynı kalsın (dikişsiz ufuk), tepe rengi biome'a göre değişsin.
if (skyDome && a.skyTop) {
const u = skyDome.material.uniforms;
u.topColor.value.copy(a.skyTop).lerp(b.skyTop, t);
u.bottomColor.value.copy(a.fogColor).lerp(b.fogColor, t);
}
}

function updateAtmosphere() {
if (!worldBiomes) return;
const coord = worldTravel / CHUNK_LEN;   // sürekli biome koordinatı
const base = Math.floor(coord);
const t = coord - base;
const cur = getBiomeForIndex(base);
const nxt = getBiomeForIndex(base + 1);
const smooth = t * t * (3 - 2 * t);
applyAtmosphere(cur, nxt, smooth);
mapPhase = (t < 0.5 ? cur.name : nxt.name);
}

function updateUnifiedWorld(activeSpeed) {
if (!worldChunks.length) return;
worldTravel += activeSpeed;
for (const c of worldChunks) c.position.z += activeSpeed;
// Kameranın arkasına geçen parçayı en öne (en uzağa) geri dönüştür.
let guard = 0;
while (guard++ < ACTIVE_CHUNKS + 2) {
let maxIdx = -1, maxZ = -Infinity, minZ = Infinity;
for (let k = 0; k < worldChunks.length; k++) {
const z = worldChunks[k].position.z;
if (z > maxZ) { maxZ = z; maxIdx = k; }
if (z < minZ) { minZ = z; }
}
if (maxZ <= CHUNK_LEN) break;
releaseChunk(worldChunks[maxIdx]);
const biome = getBiomeForIndex(worldChunkCounter);
const fresh = acquireChunk(biome);
fresh.position.set(0, 0, minZ - CHUNK_LEN);
fresh.userData.index = worldChunkCounter;
worldGroup.add(fresh);
worldChunks[maxIdx] = fresh;
worldChunkCounter++;
}
updateAtmosphere();
}

function gameLoop() {
if (!isPlaying) return;
animationFrameId = requestAnimationFrame(gameLoop);
const delta = clock.getDelta();
if (mixer) mixer.update(delta);
if (!isCrashed) updateCourseMap(delta);
distance += speed * 0.5;
updateDifficulty();
let activeSpeed = speed;
if (comboTimer > 0) { comboTimer--; } else if (comboStreak > 0) { comboStreak = 0; }
if (isDucking) activeSpeed += 0.35;
if (isJumping) {
airDistanceBonus += activeSpeed * 0.5; // Havadayken ekstra skor: toplamda 2x mesafe skoru
currentJumpPeakY = Math.max(currentJumpPeakY, playerY);
}
updateAirWhoosh(activeSpeed);
updateHud();
if (reviveInvulnFrames > 0) reviveInvulnFrames--;

if (isCrashed) {
updateCrashPieces();

// Çarpınca sahne ve kamera olduğu yerde kalır.
// World akmaz, kamera takip yapmaz, açı bozulmaz.
renderer.render(scene, camera);
return;
}

if (mapPhase === 'zipline') {
updateZiplineRide(delta);
return;
}

if(audioCtx && windFilterNode) windFilterNode.frequency.value = 300 + (activeSpeed * 1200);
updateUnifiedWorld(activeSpeed);
const targetX = currentLane * laneWidth;
const diffX = targetX - playerX;
playerX += diffX * 0.15;
const carveLean = diffX * 0.45;
skeleton.board.rotation.z = -carveLean;
const carveTurn = -carveLean * 0.6;
if (slideTimer > 0) {
slideTimer--;
isDucking = true;
} else {
isDucking = false;
}
if (isDucking) { crouchAmount += (1 - crouchAmount) * 0.24; }
else { crouchAmount += (0 - crouchAmount) * 0.18; }
if (skeleton.torso) {
if (!isJumping && !isGrinding) {
const tAnim = performance.now() * 0.001;
skeleton.board.position.set(0, -0.1, 0);
skeleton.root.rotation.x = 0;
skeleton.root.rotation.z = 0;
applyGroundGlidePose(tAnim, carveLean, crouchAmount);
if (crouchAmount > 0.02) applyDuckPose(tAnim);
if (robotModelRef && robotModelRef.scale) { robotModelRef.scale.set(0.7, 0.7 - (crouchAmount * 0.16), 0.7); }
}
}
if (isJumping) {
playerY += velocityY;
velocityY += gravity;
trickFramesCurrent++;
let progress = trickFramesCurrent / trickFramesTotal;
if(progress > 1) progress = 1;

const comboParts = String(currentTrick).split(' + ');
const segmentCount = Math.max(1, comboParts.length);
const segmentSize = 1 / segmentCount;
let segmentIndex = Math.min(segmentCount - 1, Math.floor(progress / segmentSize));
const activeTrickName = comboParts[segmentIndex] || currentTrick;
const localProgress = segmentCount > 1
  ? Math.min(1, Math.max(0, (progress - (segmentIndex * segmentSize)) / segmentSize))
  : progress;

const smooth = localProgress * localProgress * (3 - 2 * localProgress);
const pose = Math.sin(localProgress * Math.PI);
const settle = Math.sin(localProgress * Math.PI * 2);
const spinDir = (activeTrickName.includes('BACKSIDE') || activeTrickName.includes('FRONTSIDE')) ? -1 : 1;

// Snowboardcu canlılığı: kollar/omuz/diz hissi için gövde ve board mikro hareketleri
const bodySway = Math.sin(progress * Math.PI * 5) * 0.16;
const boardSway = Math.sin(progress * Math.PI * 4) * 0.18;
const shoulderSwing = Math.sin(localProgress * Math.PI * 2) * 0.22;
const kneePump = Math.sin(localProgress * Math.PI) * 0.18;
const airFloat = Math.sin(progress * Math.PI) * 0.18;
const armSwingFake = Math.sin((progress * Math.PI * 6) + airStyleSeed) * 0.18;
const hipCounter = Math.sin((progress * Math.PI * 4) + airStyleSeed) * 0.14;

const comboSpinCarry = comboParts.length > 1 ? Math.sin(progress * Math.PI) * 0.35 : 0;
// Her frame temel hava pozu: kırık/kukla gibi değil, yumuşak SSX pozu
skeleton.board.position.set(0, -0.1, 0);
skeleton.board.rotation.set(0, 0, 0);
if (skeleton.torso) {
skeleton.torso.position.set(0, 0, 0);
skeleton.torso.rotation.set(0, 0, 0);
}

skeleton.torso.rotation.x = pose * 0.35 + kneePump + armSwingFake * 0.25;
skeleton.torso.rotation.y = shoulderSwing * 0.35 + hipCounter;
skeleton.torso.rotation.z = settle * 0.12 + bodySway + armSwingFake * 0.20;
skeleton.torso.position.y = -pose * 0.16 + airFloat;
skeleton.torso.position.x = Math.sin(progress * Math.PI * 3 + airStyleSeed) * 0.10;
skeleton.board.rotation.x = pose * -0.18 + hipCounter * 0.25;
skeleton.board.rotation.y = shoulderSwing * 0.18 - hipCounter * 0.18;
skeleton.board.rotation.z = settle * 0.16 + boardSway;
applyJumpTakeoffPose(progress);

if (activeTrickName === 'NORMAL') {
skeleton.board.rotation.x = pose * -0.25;
}
else if (activeTrickName === 'BOARD TILT') {
skeleton.board.rotation.x = -0.55 * pose;
skeleton.torso.rotation.x = 0.25 * pose;
}
else if (activeTrickName === 'TAIL GRAB') {
skeleton.board.rotation.x = 0.85 * pose;
skeleton.board.rotation.z = 0.35 * pose + boardSway;
skeleton.torso.rotation.x = 1.05 * pose;
skeleton.torso.rotation.y = shoulderSwing * 0.45 + armSwingFake * 0.25;
skeleton.torso.rotation.z = 0.28 * pose + bodySway;
skeleton.torso.position.y = -0.38 * pose;
skeleton.torso.position.x = -0.12 * pose;
}
else if (activeTrickName === 'NOSE GRAB') {
skeleton.board.rotation.x = -0.75 * pose;
skeleton.board.rotation.z = -0.18 * pose;
skeleton.torso.rotation.x = 0.85 * pose;
skeleton.torso.position.y = -0.32 * pose;
}
else if (activeTrickName === 'INDY GRAB') {
skeleton.board.rotation.z = 0.85 * pose + boardSway;
skeleton.board.rotation.x = -0.32 * pose;
skeleton.torso.rotation.z = 0.68 * pose + bodySway;
skeleton.torso.rotation.y = shoulderSwing * 0.50 + armSwingFake * 0.25;
skeleton.torso.rotation.x = 0.70 * pose;
skeleton.torso.position.y = -0.32 * pose;
skeleton.torso.position.x = 0.10 * pose;
}
else if (activeTrickName === 'METHOD GRAB') {
skeleton.board.rotation.z = -0.95 * pose;
skeleton.board.rotation.x = 0.35 * pose;
skeleton.torso.rotation.z = -0.85 * pose;
skeleton.torso.rotation.x = 0.70 * pose;
skeleton.torso.position.y = -0.45 * pose;
}
else if (activeTrickName === '180 SPIN') {
skeleton.root.rotation.y = carveTurn + smooth * Math.PI * spinDir;
skeleton.board.rotation.z = pose * 0.22;
}
else if (activeTrickName === '360 SPIN' || activeTrickName === 'BACKSIDE 360' || activeTrickName === 'FRONTSIDE 360') {
skeleton.root.rotation.y = carveTurn + smooth * Math.PI * 2 * spinDir;
skeleton.board.rotation.z = pose * 0.35 * spinDir + boardSway;
skeleton.torso.rotation.z = pose * 0.35 * spinDir + bodySway;
}
else if (activeTrickName === 'BACKFLIP') {
skeleton.root.rotation.x = smooth * Math.PI * 2;
skeleton.root.rotation.z = Math.sin(localProgress * Math.PI) * 0.18;
skeleton.board.rotation.x = -pose * 0.45;
skeleton.board.rotation.z = pose * 0.32 + boardSway;
skeleton.torso.rotation.x = pose * 0.95;
skeleton.torso.rotation.y = shoulderSwing * 0.55 + armSwingFake * 0.25;
skeleton.torso.position.y = -pose * 0.42;
}
else if (activeTrickName === 'FRONTFLIP') {
skeleton.root.rotation.x = smooth * Math.PI * -2;
skeleton.root.rotation.z = Math.sin(localProgress * Math.PI) * -0.18;
skeleton.board.rotation.x = pose * 0.45;
skeleton.board.rotation.z = -pose * 0.32 + boardSway;
skeleton.torso.rotation.x = pose * 0.90;
skeleton.torso.rotation.y = shoulderSwing * 0.50 + armSwingFake * 0.25;
skeleton.torso.position.y = -pose * 0.42;
}
else if (activeTrickName === 'CORK 360') {
skeleton.root.rotation.y = smooth * Math.PI * 2;
skeleton.root.rotation.z = pose * 0.95;
skeleton.root.rotation.x = pose * 0.45;
skeleton.board.rotation.z = pose * 0.45 + boardSway;
}
else if (activeTrickName === 'RODEO 540') {
skeleton.root.rotation.x = smooth * Math.PI * 2;
skeleton.root.rotation.y = smooth * Math.PI * 3;
skeleton.root.rotation.z = pose * 0.75;
skeleton.torso.position.y = -pose * 0.45;
}
else if (activeTrickName === 'DOUBLE BACKFLIP') {
skeleton.root.rotation.x = smooth * Math.PI * 4;
skeleton.root.rotation.z = Math.sin(localProgress * Math.PI * 2) * 0.20;
skeleton.board.rotation.x = -pose * 0.55;
skeleton.board.rotation.z = pose * 0.48 + boardSway;
skeleton.torso.rotation.x = pose * 1.05;
skeleton.torso.rotation.y = shoulderSwing * 0.65 + armSwingFake * 0.25;
skeleton.torso.position.y = -pose * 0.52;
}
else if (activeTrickName === 'DOUBLE FRONTFLIP') {
skeleton.root.rotation.x = smooth * Math.PI * -4;
skeleton.root.rotation.z = Math.sin(localProgress * Math.PI * 2) * -0.20;
skeleton.board.rotation.x = pose * 0.55;
skeleton.board.rotation.z = -pose * 0.48 + boardSway;
skeleton.torso.rotation.x = pose * 1.00;
skeleton.torso.rotation.y = shoulderSwing * 0.65 + armSwingFake * 0.25;
skeleton.torso.position.y = -pose * 0.52;
}
else if (activeTrickName === '720 SPIN') {
skeleton.root.rotation.y = carveTurn + smooth * Math.PI * 4;
skeleton.board.rotation.z = pose * 0.45 + boardSway;
skeleton.torso.rotation.z = pose * 0.45 + bodySway;
}
else if (activeTrickName === 'CORK 720') {
skeleton.root.rotation.y = smooth * Math.PI * 4;
skeleton.root.rotation.z = pose * 1.25;
skeleton.root.rotation.x = pose * 0.70;
skeleton.board.rotation.z = pose * 0.65;
}
else if (activeTrickName === 'MISTY FLIP') {
skeleton.root.rotation.x = smooth * Math.PI * -2;
skeleton.root.rotation.y = smooth * Math.PI * 2;
skeleton.root.rotation.z = pose * 0.95;
}
else if (activeTrickName === 'RODEO 720') {
skeleton.root.rotation.x = smooth * Math.PI * 2;
skeleton.root.rotation.y = smooth * Math.PI * 4;
skeleton.root.rotation.z = pose * 0.90;
skeleton.torso.position.y = -pose * 0.50;
}
else if (activeTrickName === 'SUPERMAN GRAB') {
skeleton.root.rotation.y = smooth * Math.PI * 2;
skeleton.board.rotation.x = -1.15 * pose;
skeleton.board.position.y = -0.10 + pose * 0.45;
skeleton.torso.rotation.x = -0.95 * pose;
skeleton.torso.position.y = pose * 0.25;
}
else if (activeTrickName === 'ROCKET AIR') {
skeleton.board.rotation.x = -1.45 * pose;
skeleton.torso.rotation.x = -0.65 * pose;
skeleton.root.rotation.y = smooth * Math.PI * 2;
skeleton.torso.position.y = pose * 0.15;
}
else if (activeTrickName === 'TRIPLE BACKFLIP') {
skeleton.root.rotation.x = smooth * Math.PI * 6;
skeleton.root.rotation.z = pose * 0.35;
skeleton.torso.position.y = -pose * 0.55;
}
else if (activeTrickName === '1080 SPIN') {
skeleton.root.rotation.y = smooth * Math.PI * 6;
skeleton.board.rotation.z = pose * 0.55;
skeleton.torso.rotation.z = pose * 0.50;
}
else if (activeTrickName === 'MISTY 1080') {
skeleton.root.rotation.x = smooth * Math.PI * -2;
skeleton.root.rotation.y = smooth * Math.PI * 6;
skeleton.root.rotation.z = pose * 1.10;
skeleton.board.rotation.z = pose * 0.80;
}
else if (activeTrickName === 'BOARD OFF GRAB') {
skeleton.root.rotation.y = smooth * Math.PI * 2;
skeleton.board.position.y = -0.10 + pose * 0.95;
skeleton.board.position.x = pose * 0.55;
skeleton.board.rotation.z = pose * 1.35;
skeleton.torso.rotation.z = -pose * 0.60;
skeleton.torso.position.y = -pose * 0.20;
}
else if (activeTrickName === 'SUPERMAN 1080') {
skeleton.root.rotation.y = smooth * Math.PI * 6;
skeleton.board.rotation.x = -1.25 * pose;
skeleton.board.position.y = -0.10 + pose * 0.55;
skeleton.torso.rotation.x = -1.05 * pose;
skeleton.torso.position.y = pose * 0.30;
}
else if (activeTrickName === 'UBER TRICK') {
skeleton.root.rotation.x = smooth * Math.PI * 2;
skeleton.root.rotation.y = smooth * Math.PI * 4;
skeleton.board.position.y = -0.10 + pose * 0.80;
skeleton.board.rotation.z = pose * Math.PI * 0.85;
skeleton.board.rotation.x = -pose * 0.85;
skeleton.torso.rotation.z = -pose * 0.70;
skeleton.torso.position.y = -pose * 0.25;
}
else if (activeTrickName === 'MONSTER FLIP') {
skeleton.root.rotation.x = smooth * Math.PI * 4;
skeleton.root.rotation.y = smooth * Math.PI * 3;
skeleton.root.rotation.z = pose * 1.25;
skeleton.board.rotation.z = pose * 0.95;
}
else if (activeTrickName === 'SSX SIGNATURE') {
skeleton.root.rotation.x = smooth * Math.PI * 4;
skeleton.root.rotation.y = smooth * Math.PI * 6;
skeleton.board.position.y = -0.10 + pose * 1.05;
skeleton.board.position.x = Math.sin(progress * Math.PI * 2) * 0.45;
skeleton.board.rotation.z = pose * Math.PI;
skeleton.board.rotation.x = -pose * 0.95;
skeleton.torso.rotation.z = Math.sin(progress * Math.PI * 2) * 0.65;
skeleton.torso.position.y = -pose * 0.35;
}

if (playerY <= basePlayerY) {
playerY = basePlayerY;
if (currentTrick !== 'NORMAL' && currentTrick !== 'NONE') {
rewardLandingTrickScore();
}
isJumping = false;
velocityY = 0;
currentTrick = 'NONE';
skeleton.root.rotation.set(0,0,0);
skeleton.board.rotation.set(0,0,0);
skeleton.board.position.set(0, -0.1, 0);
skeleton.torso.position.set(0,0,0);
skeleton.torso.rotation.set(0,0,0);
chooseGlideVariant();
playAnim('idle');
playSound('land');
shakeIntensity = 0.28;
}
} else if (!isGrinding) {
playerY = basePlayerY;
skeleton.root.rotation.y = carveTurn;
}
skeleton.root.position.set(playerX, playerY, 0);
const targetFov = 74 + (activeSpeed - baseSpeed)*16 + (crouchAmount * 5) + (isGrinding ? 5 : 0);
camera.fov += (targetFov - camera.fov) * 0.08;
camera.updateProjectionMatrix();

// KAMERA YENİ AYAR: belirgin şekilde daha yüksek, biraz daha geride ve piste/aşağıya bakıyor.
const cameraTargetY = playerY + 9.8 - (crouchAmount * 0.35);
const cameraTargetZ = player.position.z + 11.2 - (crouchAmount * 0.4);
camera.position.x += (playerX - camera.position.x) * 0.28;
camera.position.y += (cameraTargetY - camera.position.y) * 0.28;
camera.position.z += (cameraTargetZ - camera.position.z) * 0.28;
let shakeX = (Math.random() - 0.5) * shakeIntensity;
let shakeY = (Math.random() - 0.5) * shakeIntensity;
if (shakeIntensity > 0) shakeIntensity -= 0.05;
if (activeSpeed > 1.2 && !isJumping) shakeY += Math.sin(Date.now()*0.05)*0.03;
camera.lookAt(playerX + shakeX, playerY + 0.15 + shakeY, player.position.z - 27.0);
const trailPos = trailParticles.geometry.attributes.position.array;
for(let i=0; i<trailPos.length; i+=3) {
trailPos[i+2] += activeSpeed;
if(trailPos[i+2] > player.position.z + 2) {
if(!isJumping) {
let edgeOffset = carveLean > 0 ? -1.0 : 1.0;
if(Math.abs(carveLean) < 0.1) edgeOffset = (Math.random()-0.5)*1.8;
trailPos[i] = playerX + edgeOffset;
trailPos[i+1] = basePlayerY + Math.random()*0.4 + (Math.abs(carveLean)*0.5);
trailPos[i+2] = player.position.z - 1.0;
} else trailPos[i+1] = -10;
}
}
trailParticles.geometry.attributes.position.needsUpdate = true;
spawnObject();
for (let i = obstacles.length - 1; i >= 0; i--) {
const obs = obstacles[i];
if (!obs.active) {
obs.mesh.position.z += activeSpeed;
obs.removeDelay = (obs.removeDelay || 0) - 1;
if (obs.removeDelay <= 0 || obs.mesh.position.z > 45) {
removeObstacleAt(i);
}
continue;
}
obs.mesh.position.z += activeSpeed;
if (obs.type === 'mineCart') {
const wheels = obs.mesh.userData.wheels || [];
for (const wheel of wheels) wheel.rotation.y -= activeSpeed * 0.24;
obs.mesh.position.y = Math.sin(Date.now() * 0.012 + obs.mesh.position.z * 0.08) * 0.035;
}
if (obs.type === 'coin') {
obs.mesh.rotation.y += 0.1;
obs.mesh.position.y = 1.2 + Math.sin(Date.now() * 0.005) * 0.3;
if (Math.abs(obs.mesh.position.z - player.position.z) < 1.5 && Math.abs(obs.mesh.position.x - playerX) < 1.8 && playerY < obs.hitY) {
const coinWorldPos = new THREE.Vector3();
obs.mesh.getWorldPosition(coinWorldPos);
coins++;
obs.active = false;
removeObstacleAt(i);
registerCoinCollect(coinWorldPos);
continue;
}
} else if (obs.type === 'ramp') {
const zDist = obs.mesh.position.z - player.position.z;
const xDist = Math.abs(obs.mesh.position.x - playerX);
if (zDist > -4.0 && zDist < 1.0 && xDist < 2.2) {
if (zDist > -0.5 && zDist < 0.5 && !isJumping && !isGrinding) {
obs.active = false;
obs.removeDelay = 120;
triggerJump(true);
continue;
}
}
} else {
const spec = getObstacleSpec(obs.type);
if (spec.kind === 'duck' || spec.kind === 'jump' || spec.kind === 'side') {
const zDist = obs.mesh.position.z - player.position.z;
const xDist = Math.abs(obs.mesh.position.x - playerX);

if (zDist < spec.z && zDist > -spec.z && xDist < spec.x) {
if (reviveInvulnFrames > 0) {
obs.active = false;
obs.removeDelay = 14;
continue;
}
if (isPlayerAboveObstacle(obs, spec)) {
clearObstacleInAir(obs, spec.clear || 'AIR CLEAR!');
} else if (spec.kind === 'duck') {
if (isDucking || crouchAmount > 0.38) {
obs.active = false;
obs.removeDelay = 70;
registerSuccess('slide', 'PERFECT SLIDE!');
} else {
crashIntoObstacle(obs, spec);
continue;
}
} else if (spec.kind === 'jump') {
if (playerY > spec.passY) {
obs.active = false;
obs.removeDelay = 70;
registerSuccess('jump', spec.clear || 'PERFECT JUMP!');
} else {
crashIntoObstacle(obs, spec);
continue;
}
} else if (spec.kind === 'side') {
crashIntoObstacle(obs, spec);
continue;
}
} else if (!obs.closeScored && zDist < 0.45 && zDist > -2.25) {
// Son anda kenardan kaçma bonusu. Oyuncu çarpmıyorsa ama engele çok yakın geçtiyse ödüllendir.
const edgeDist = xDist - spec.x;
const notWayAbove = playerY < (spec.top + 0.75);
if (edgeDist > 0 && edgeDist < 1.35 && notWayAbove) {
obs.closeScored = true;
registerSuccess('close', 'CLOSE CALL!');
}
}
}
}
if (obs.mesh.position.z > 60) removeObstacleAt(i);
}
const snowPos = snowParticles.geometry.attributes.position.array;
for(let i = 1; i < snowPos.length; i += 3) {
snowPos[i] -= 0.15; snowPos[i-1] += Math.sin(Date.now()*0.001 + i) * 0.05; snowPos[i+1] += activeSpeed * 0.9;
if(snowPos[i] < 0) snowPos[i] = 50; if(snowPos[i+1] > 10) snowPos[i+1] = -180;
}
snowParticles.geometry.attributes.position.needsUpdate = true;





updateCrashPieces();

if (!isGrinding) { const m = document.getElementById('balance-meter'); if (m) m.style.display = 'none'; }
renderer.render(scene, camera);
}
</script>
</body>
</html>
