<style>

85% { opacity: 1; transform: translate(-50%, 0) scale(1); }

</style>

<body>
<div id="balance-meter"><div id="balance-fill"></div></div>

</div>

  <div class="game-over-shell">
    <img class="go-panel-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAFgwJ/lQm5WQAAAABJRU5ErkJggg==" alt="Game Over">

<script>
const TREE_BARK_TEXTURE_DATA = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAFgwJ/lQm5WQAAAABJRU5ErkJggg==';
const TREE_LEAF_TEXTURE_DATA = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAFgwJ/lQm5WQAAAABJRU5ErkJggg==';
const TREE_LEAF_ALPHA_DATA = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAFgwJ/lQm5WQAAAABJRU5ErkJggg==';
const apiKey = "";
async function callGeminiAPI(prompt, retries = 5) {
const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
const payload = {
contents: [{ parts: [{ text: prompt }] }],
systemInstruction: { parts: [{ text: "Sen e-spor kayakçılarına koçluk yapan, esprili, biraz sert ama çok motive edici bir yapay zeka antrenörsün." }] }
};
const delays = [1000, 2000, 4000, 8000];
for (let attempt = 0; attempt < retries; attempt++) {
try {
const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
if (!response.ok) throw new Error(`API hatası! durum: ${response.status}`);
const data = await response.json();
return data.candidates?.[0]?.content?.parts?.[0]?.text || "Bugün pistte iz bıraktın, ama koç hâlâ daha fazlasını istiyor!";
} catch (error) {
if (attempt === retries - 1) throw error;
await new Promise(resolve => setTimeout(resolve, delays[attempt] || 8000));
}
}
}
async function getAICommentary() {
const btn = document.getElementById('ai-btn'); const box = document.getElementById('ai-commentary-box');
const finalDist = Math.floor(distance);
btn.disabled = true; btn.innerText = "Antrenör Düşünüyor..."; box.style.display = "block";
box.innerHTML = '<span style="color:#fcd34d">Koç maç kasetini inceliyor...</span>';
const prompt = `Öğrencin simülasyonu tamamladı. Skor: ${finalDist}m, ${coins} altın. Yüksek hızda rampalardan uçup Superman ve SSX Uber taklaları atarak şov yaptı. Kısa (2 cümle), esprili ve motive edici bir antrenör yorumu yap. Kesinlikle Türkçe yanıt ver.`;
try {
const commentary = await callGeminiAPI(prompt);
box.innerHTML = `<strong>Koç:</strong> "${commentary.replace(/"/g, '')}"`;
btn.innerText = "✨ Başka Yorum Al ✨";
} catch (error) {
box.innerHTML = "Antrenörün telsizi bozuldu, fırtına var! Tekrar dene.";
btn.innerText = "✨ AI Koç Yorumu Al ✨";
} finally { btn.disabled = false; }
}
let audioCtx, windGainNode, windFilterNode, airWhooshGainNode, airWhooshFilterNode;
function initAudio() {
if(audioCtx) return;
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const bufferSize = audioCtx.sampleRate * 2;
const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
const output = noiseBuffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }
const whiteNoise = audioCtx.createBufferSource(); whiteNoise.buffer = noiseBuffer; whiteNoise.loop = true;
windFilterNode = audioCtx.createBiquadFilter(); windFilterNode.type = 'lowpass'; windFilterNode.frequency.value = 300;
windGainNode = audioCtx.createGain(); windGainNode.gain.value = 0;
whiteNoise.connect(windFilterNode); windFilterNode.connect(windGainNode); windGainNode.connect(audioCtx.destination);

airWhooshFilterNode = audioCtx.createBiquadFilter();
airWhooshFilterNode.type = 'bandpass';
airWhooshFilterNode.frequency.value = 900;
airWhooshFilterNode.Q.value = 0.85;
airWhooshGainNode = audioCtx.createGain();
airWhooshGainNode.gain.value = 0.0001;
whiteNoise.connect(airWhooshFilterNode);
airWhooshFilterNode.connect(airWhooshGainNode);
airWhooshGainNode.connect(audioCtx.destination);

whiteNoise.start(0);
}
function playSound(type) {
if(!audioCtx || audioCtx.state === 'suspended') return;
const now = audioCtx.currentTime;
function tone(freq, start, dur, vol, wave) {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = wave || 'sine';
osc.frequency.setValueAtTime(freq, now + start);
gain.gain.setValueAtTime(vol, now + start);
gain.gain.exponentialRampToValueAtTime(0.01, now + start + dur);
osc.connect(gain); gain.connect(audioCtx.destination);
osc.start(now + start); osc.stop(now + start + dur);
}
if(type === 'jump') {
tone(210, 0, 0.22, 0.45, 'sawtooth');
tone(90, 0.02, 0.50, 0.26, 'triangle');
} else if(type === 'land') {
tone(120, 0, 0.25, 0.46, 'square');
tone(42, 0.02, 0.28, 0.30, 'sine');
} else if(type === 'coin') {
// Altın alma hissi: kısa, parlak, iki notalı mobil oyun sesi.
tone(720, 0.00, 0.10, 0.24, 'sine');
tone(1080, 0.055, 0.13, 0.22, 'sine');
tone(1440, 0.11, 0.10, 0.16, 'triangle');
} else if(type === 'success') {
// Başarı sesi: küçük yukarı çıkan arpej.
tone(520, 0.00, 0.12, 0.22, 'sine');
tone(780, 0.06, 0.14, 0.22, 'sine');
tone(1040, 0.13, 0.18, 0.20, 'triangle');
} else if(type === 'perfect') {
// Perfect için daha tatlı ve tok başarı efekti.
tone(660, 0.00, 0.11, 0.25, 'sine');
tone(990, 0.07, 0.13, 0.25, 'sine');
tone(1320, 0.14, 0.20, 0.22, 'triangle');
tone(220, 0.00, 0.18, 0.12, 'sine');
} else if(type === 'combo') {
// Combo büyüyünce mini fanfar.
tone(620, 0.00, 0.10, 0.22, 'square');
tone(860, 0.06, 0.10, 0.22, 'square');
tone(1120, 0.12, 0.14, 0.24, 'triangle');
tone(1480, 0.20, 0.18, 0.20, 'sine');
} else if(type === 'close') {
tone(980, 0.00, 0.07, 0.18, 'triangle');
tone(480, 0.05, 0.12, 0.14, 'sine');
} else if(type === 'air') {
// Havadayken başlayan hafif SSX tarzı parlak süzülme efekti.
tone(560, 0.00, 0.16, 0.13, 'triangle');
tone(840, 0.04, 0.22, 0.10, 'sine');
tone(1280, 0.10, 0.18, 0.07, 'triangle');
} else if(type === 'crash') {
tone(95, 0.00, 0.24, 0.44, 'sawtooth');
tone(48, 0.04, 0.38, 0.36, 'square');
}
}

function updateAirWhoosh(activeSpeed) {
if(!audioCtx || !airWhooshGainNode || !airWhooshFilterNode || audioCtx.state === 'suspended') return;
const now = audioCtx.currentTime;
const inAir = isJumping && !isCrashed && !isGrinding;
const lift = Math.min(1, Math.abs(velocityY) * 2.2);
const speedBoost = Math.max(0, Math.min(1, (activeSpeed - baseSpeed) * 0.65));
const targetGain = inAir ? (0.075 + lift * 0.11 + speedBoost * 0.08) : 0.0001;
const targetFreq = inAir ? (760 + activeSpeed * 560 + lift * 520) : 620;
airWhooshFilterNode.frequency.setTargetAtTime(targetFreq, now, 0.05);
airWhooshGainNode.gain.setTargetAtTime(targetGain, now, 0.07);
}

function playButtonSound() {

if (!audioCtx) return;
if (audioCtx.state === 'suspended') {
  audioCtx.resume();
}
const now = audioCtx.currentTime;
const master = audioCtx.createGain();
master.gain.setValueAtTime(0.0001, now);
master.gain.linearRampToValueAtTime(0.18, now + 0.008);
master.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
master.connect(audioCtx.destination);

const oscA = audioCtx.createOscillator();
oscA.type = 'triangle';
oscA.frequency.setValueAtTime(880, now);
oscA.frequency.exponentialRampToValueAtTime(620, now + 0.16);
oscA.connect(master);
oscA.start(now);
oscA.stop(now + 0.16);

const oscB = audioCtx.createOscillator();
const gainB = audioCtx.createGain();
oscB.type = 'sine';
oscB.frequency.setValueAtTime(1320, now + 0.01);
oscB.frequency.exponentialRampToValueAtTime(980, now + 0.13);
gainB.gain.setValueAtTime(0.10, now);
gainB.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
oscB.connect(gainB);
gainB.connect(audioCtx.destination);
oscB.start(now + 0.01);
oscB.stop(now + 0.13);
}

function getTrickBaseScore(name) {
return trickScoreMap[name] || 60;
}

function getTopTrickName(parts) {
const list = Array.isArray(parts) ? parts : String(parts || '').split(' + ').filter(Boolean);
if (!list.length) return 'TRICK';
let best = list[0];
let bestVal = getTrickBaseScore(best);
for (const item of list) {
const val = getTrickBaseScore(item);
if (val > bestVal) { best = item; bestVal = val; }
}
return best;
}

function computeCurrentJumpTrickScore() {
if (!currentJumpParts || !currentJumpParts.length) return 0;
const base = currentJumpParts.reduce((sum, item) => sum + getTrickBaseScore(item), 0);
const comboMultiplier = 1 + Math.max(0, currentJumpParts.length - 1) * 0.42;
const heightGain = Math.max(0, currentJumpPeakY - basePlayerY);
const heightFactor = 1 + Math.min(0.95, heightGain * 0.20);
const speedFactor = 1 + Math.min(0.55, Math.max(0, currentJumpStartSpeed - baseSpeed) * 0.28);
const liftFactor = 1 + Math.min(0.38, Math.max(0, currentJumpStartVelocity - 0.24) * 0.85);
const rampFactor = currentJumpRampBoost ? 1.14 : 0.92;
return Math.round(base * comboMultiplier * heightFactor * speedFactor * liftFactor * rampFactor);
}

function projectWorldToScreen(worldVec) {
if (!worldVec || !camera) return { x: window.innerWidth * 0.5, y: window.innerHeight * 0.45 };
const v = worldVec.clone().project(camera);
return {
x: (v.x * 0.5 + 0.5) * window.innerWidth,
y: (-v.y * 0.5 + 0.5) * window.innerHeight
};
}

function createValleyGeometry() {

function clearCourseGround() {
const oldGrounds = [ground1, ground2].filter(Boolean);
const oldMaterials = courseOwnedMaterials.slice();
for (const ground of oldGrounds) worldGroup.remove(ground);
courseOwnedMaterials = [];
ground1 = null;
ground2 = null;
if (renderer && renderer.renderLists && renderer.renderLists.dispose) renderer.renderLists.dispose();

const disposeOldCourse = () => {
const disposedGeometries = new Set();
for (const ground of oldGrounds) {
ground.traverse(obj => {
if (obj.geometry && obj.geometry.dispose && !disposedGeometries.has(obj.geometry)) {
disposedGeometries.add(obj.geometry);
obj.geometry.dispose();
}
});
}
for (const material of oldMaterials) {
if (!material) continue;
if (material.map && material.map.isTexture) material.map.dispose();
if (material.alphaMap && material.alphaMap.isTexture && material.alphaMap !== material.map) material.alphaMap.dispose();
if (material.dispose) material.dispose();
}
};

if (window.requestIdleCallback) window.requestIdleCallback(disposeOldCourse, { timeout: 1800 });
else setTimeout(disposeOldCourse, 650);
}

function getCliffTerrainHeight(x, z) {
const trackWave = Math.sin(z * 0.034) * 0.04 + Math.sin(z * 0.011) * 0.06;
if (x < -19) {
const rise = -x - 19;
const mountain = Math.pow(rise, 1.10) * 0.34;
const crags = Math.sin(z * 0.043 + x * 0.14) * Math.min(5.8, rise * 0.095);
const shelves = Math.sin(z * 0.097 - x * 0.12) * Math.min(2.6, rise * 0.045);
return trackWave + mountain + crags + shelves;
}
if (x > 20) {
// Sağ taraf artık aşağı düşen dalgalı yamaç değil, sola benzer gerçek dağ silsilesi.
const rise = x - 20;
const mountain = Math.pow(rise, 1.08) * 0.33;
const crags = Math.sin(z * 0.047 - x * 0.13) * Math.min(6.2, rise * 0.10);
const shelves = Math.sin(z * 0.089 + x * 0.11) * Math.min(2.8, rise * 0.048);
return trackWave + mountain + crags + shelves;
}
return trackWave + Math.sin(x * 0.28 + z * 0.018) * 0.045;
}

function createCliffTerrainGeometry() {
const geo = new THREE.PlaneGeometry(250, 400, 64, 96);
const pos = geo.attributes.position;
const colors = new Float32Array(pos.count * 3);
const color = new THREE.Color();
for (let i = 0; i < pos.count; i++) {
const x = pos.getX(i);
const z = pos.getY(i);
const height = getCliffTerrainHeight(x, z);
pos.setZ(i, height);

if (x >= -20 && x <= 20) {
const shade = 0.92 + Math.sin(z * 0.055 + x * 0.18) * 0.025;
color.setRGB(shade, Math.min(1, shade + 0.045), 1.0);
} else {
// Hem sol hem sağ dağ yamaçları: yükseldikçe karlanan kayalık dağ rengi.
const snowMix = Math.min(0.74, Math.max(0.08, (height - 5) / 55));
color.setRGB(0.20 + snowMix * 0.66, 0.26 + snowMix * 0.67, 0.34 + snowMix * 0.62);
}
colors[i * 3] = color.r;
colors[i * 3 + 1] = color.g;
colors[i * 3 + 2] = color.b;
}
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
pos.needsUpdate = true;
geo.computeVertexNormals();
return geo;
}

function createSoftCloudTexture() {

}

function createIceCaveTunnelGeometry() {
const geo = new THREE.CylinderGeometry(28, 28, 400, 36, 72, true, Math.PI / 2, Math.PI);
const pos = geo.attributes.position;
const colors = new Float32Array(pos.count * 3);
const color = new THREE.Color();
for (let i = 0; i < pos.count; i++) {
const x = pos.getX(i);
const along = pos.getY(i);
const z = pos.getZ(i);
const radius = Math.max(0.001, Math.sqrt(x * x + z * z));
const largeCrag = Math.sin(along * 0.037 + x * 0.21) * 1.15;
const smallCrag = Math.sin(along * 0.12 - z * 0.32) * 0.48;
const ridge = Math.sin(x * 0.58 + along * 0.018) * 0.62;
const targetRadius = radius + largeCrag + smallCrag + ridge;
pos.setX(i, x * targetRadius / radius);
pos.setZ(i, z * targetRadius / radius);

const iceBand = Math.max(0, Math.min(1, (-z / radius) * 0.72 + 0.22));
const variation = Math.sin(along * 0.08 + x * 0.35) * 0.045;
color.setRGB(0.08 + iceBand * 0.18 + variation, 0.22 + iceBand * 0.34 + variation, 0.31 + iceBand * 0.43 + variation);
colors[i * 3] = color.r;
colors[i * 3 + 1] = color.g;
colors[i * 3 + 2] = color.b;
}
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
pos.needsUpdate = true;
geo.computeVertexNormals();
return geo;
}

function removeCoursePortal() {
if (!coursePortal) return;
const oldPortal = coursePortal;
const materials = oldPortal.userData.portalMaterials || [];
worldGroup.remove(oldPortal);
coursePortal = null;
coursePortalKind = '';
coursePortalPathCleared = false;
if (renderer && renderer.renderLists && renderer.renderLists.dispose) renderer.renderLists.dispose();

const disposePortal = () => {
const disposedGeometries = new Set();
oldPortal.traverse(obj => {
if (obj.geometry && obj.geometry.dispose && !disposedGeometries.has(obj.geometry)) {
disposedGeometries.add(obj.geometry);
obj.geometry.dispose();
}
});
for (const material of materials) if (material && material.dispose) material.dispose();
};
if (window.requestIdleCallback) window.requestIdleCallback(disposePortal, { timeout: 1800 });
else setTimeout(disposePortal, 650);
}

function showCoursePortal(kind) {
if (coursePortal && coursePortalKind === kind) return;
removeCoursePortal();
coursePortal = kind === 'zipline' ? createZiplinePortal() : createIceCavePortal(kind);
coursePortalKind = kind;
coursePortalPathCleared = false;
coursePortal.position.z = kind === 'exit' ? -1763 : -1660;
coursePortal.position.y = 0;
coursePortal.userData.approachStartTime = kind === 'entrance' ? 5 : (kind === 'exit' ? 40 : 65);
coursePortal.userData.approachEndTime = kind === 'entrance' ? 30 : (kind === 'exit' ? 60 : 90);
coursePortal.userData.approachStartZ = coursePortal.position.z;
coursePortal.userData.preloadTriggered = false;
worldGroup.add(coursePortal);

const materials = coursePortal.userData.portalMaterials || [];
for (const material of materials) {
if (!material) continue;
material.userData.portalBaseOpacity = material.opacity === undefined ? 1 : material.opacity;
material.transparent = true;
material.opacity = 0;
material.depthWrite = false;
}
}

function updateCoursePortal() {
if (!coursePortal) return;
const crossingPoint = coursePortalKind === 'exit' ? 16 : 2;
const startTime = coursePortal.userData.approachStartTime;
const endTime = coursePortal.userData.approachEndTime;
const approachProgress = Math.min(1, Math.max(0, (runElapsed - startTime) / (endTime - startTime)));
coursePortal.position.z = THREE.MathUtils.lerp(coursePortal.userData.approachStartZ, crossingPoint, approachProgress);

const fade = Math.min(1, Math.max(0, (coursePortal.position.z + 850) / 260));
const smoothFade = fade * fade * (3 - 2 * fade);
const materials = coursePortal.userData.portalMaterials || [];
for (const material of materials) {
if (!material) continue;
const baseOpacity = material.userData.portalBaseOpacity === undefined ? 1 : material.userData.portalBaseOpacity;
material.opacity = baseOpacity * smoothFade;
if (smoothFade >= 0.999 && baseOpacity >= 1) {
material.transparent = false;
material.depthWrite = true;
}
}

if (!coursePortal.userData.preloadTriggered && coursePortal.position.z >= -150) {
coursePortal.userData.preloadTriggered = true;
const nextType = coursePortalKind === 'entrance' ? 'cave' : (coursePortalKind === 'exit' ? 'cliff' : 'forest');
const prepared = nextType === 'cave' ? preparedCaveCourse : (nextType === 'cliff' ? preparedCliffCourse : preparedForestCourse);
if (!prepared) prepareCourseInBackground(nextType);
}

if (!coursePortalPathCleared && coursePortal.position.z >= -150) {
coursePortalPathCleared = true;
clearObstaclesForCourseChange();
}
if (coursePortal.position.z >= crossingPoint) {
if (coursePortalKind === 'entrance') switchToIceCaveCourse();
else if (coursePortalKind === 'exit') switchToCliffCourse();
else startZiplineRide();
}
}

function createRealMountainRangeGeometry(layer) {
const columns = layer === 0 ? 68 : 54;
const rows = 128;
const xMin = layer === 0 ? 34 : 105;
const xMax = layer === 0 ? 182 : 282;
const baseY = layer === 0 ? -86 : -104;
const peaks = layer === 0 ? [
{ x: 76, z: -168, h: 72, wx: 48, wz: 67, lean: -0.28 },
{ x: 111, z: -98, h: 96, wx: 61, wz: 72, lean: 0.34 },
{ x: 69, z: -24, h: 66, wx: 45, wz: 59, lean: -0.46 },
{ x: 122, z: 58, h: 101, wx: 64, wz: 78, lean: 0.22 },
{ x: 88, z: 151, h: 80, wx: 53, wz: 69, lean: -0.18 }
] : [
{ x: 159, z: -154, h: 91, wx: 73, wz: 86, lean: 0.26 },
{ x: 205, z: -55, h: 112, wx: 82, wz: 94, lean: -0.31 },
{ x: 153, z: 51, h: 86, wx: 69, wz: 82, lean: 0.42 },
{ x: 224, z: 148, h: 118, wx: 88, wz: 91, lean: -0.24 }
];
const positions = [];
const indices = [];

function hash(ix, iz, seed) {
const value = Math.sin(ix * 127.1 + iz * 311.7 + seed * 74.7) * 43758.5453;
return value - Math.floor(value);
}
function periodicNoise(x, z, seed, period) {
const x0 = Math.floor(x);
const z0 = Math.floor(z);
const tx = x - x0;
const tz = z - z0;
const sx = tx * tx * (3 - 2 * tx);
const sz = tz * tz * (3 - 2 * tz);
const wrap = value => ((value % period) + period) % period;
const a = hash(x0, wrap(z0), seed);
const b = hash(x0 + 1, wrap(z0), seed);
const c = hash(x0, wrap(z0 + 1), seed);
const d = hash(x0 + 1, wrap(z0 + 1), seed);
const top = THREE.MathUtils.lerp(a, b, sx);
const bottom = THREE.MathUtils.lerp(c, d, sx);
return THREE.MathUtils.lerp(top, bottom, sz);
}
function fbm(x, z, seed) {
let value = 0;
let amplitude = 0.56;
let frequency = 1;
for (let octave = 0; octave < 4; octave++) {
value += periodicNoise(x * frequency, z * frequency, seed + octave * 5.1, 16 * frequency) * amplitude;
frequency *= 2;
amplitude *= 0.48;
}
return value / 1.05;
}

for (let row = 0; row <= rows; row++) {
const v = row / rows;
const z = -200 + v * 400;
for (let column = 0; column <= columns; column++) {
const u = column / columns;
const x = THREE.MathUtils.lerp(xMin, xMax, u);
let mountainMass = 0;
let ridgeMass = 0;
for (const peak of peaks) {
let dz = z - peak.z;
dz -= Math.round(dz / 400) * 400;
const dx = x - peak.x - dz * peak.lean * 0.16;
const radial = Math.sqrt((dx * dx) / (peak.wx * peak.wx) + (dz * dz) / (peak.wz * peak.wz));
const body = Math.pow(Math.max(0, 1 - radial), 1.24) * peak.h;
const ridgeDistance = Math.abs(dx / peak.wx * 0.74 + dz / peak.wz * peak.lean);
const spine = Math.pow(Math.max(0, 1 - ridgeDistance * 3.4), 1.7) * Math.max(0, 1 - radial) * peak.h * 0.23;
mountainMass = Math.max(mountainMass, body + spine);
ridgeMass = Math.max(ridgeMass, body / peak.h);
}

const noiseZ = (z + 200) / 25;
const broadNoise = fbm(x * 0.026, noiseZ, 3.7 + layer * 11, 16);
const detailNoise = fbm(x * 0.075, noiseZ, 17.2 + layer * 9, 16);
const ridgeNoise = 1 - Math.abs(detailNoise * 2 - 1);
const erosionNoise = fbm(x * 0.041 + 19, noiseZ, 31.6 + layer * 4, 16);
const erosionChannel = Math.pow(Math.max(0, 0.18 - Math.abs(erosionNoise - 0.5)) / 0.18, 2);
const edgeFade = Math.pow(Math.sin(Math.PI * u), 0.38);
const lift = edgeFade * Math.max(0, mountainMass * (0.77 + broadNoise * 0.34) + ridgeNoise * 8.5 * ridgeMass - erosionChannel * 10.5 * ridgeMass);
positions.push(x, baseY + lift, z);
}
}

for (let row = 0; row < rows; row++) {
for (let column = 0; column < columns; column++) {
const a = row * (columns + 1) + column;
const b = a + 1;
const c = a + columns + 1;
const d = c + 1;
indices.push(a, c, b, b, c, d);
}
}
const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
geometry.setIndex(indices);
geometry.computeVertexNormals();

const normals = geometry.attributes.normal;
const positionAttribute = geometry.attributes.position;
const colors = new Float32Array(positionAttribute.count * 3);
const color = new THREE.Color();
for (let i = 0; i < positionAttribute.count; i++) {
const y = positionAttribute.getY(i);
const x = positionAttribute.getX(i);
const steepness = Math.min(1, Math.max(0, 1 - normals.getY(i)));
const height = Math.min(1, Math.max(0, (y - baseY) / 95));
const strata = 0.92 + Math.sin(y * 0.48 + x * 0.09) * 0.06;
const lightFace = 0.17 + height * 0.16 + (1 - steepness) * 0.06;
color.setRGB(
(lightFace + steepness * 0.035) * strata,
(lightFace * 0.91 + steepness * 0.018) * strata,
(lightFace * 0.84) * strata
);
colors[i * 3] = color.r;
colors[i * 3 + 1] = color.g;
colors[i * 3 + 2] = color.b;
}
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
return geometry;
}

const minimumSpacing = meshIndex === 0 ? 10 : 14;
const selected = [];
for (const candidate of candidates) {
if (selected.some(item => Math.hypot(item.x - candidate.x, item.z - candidate.z) < minimumSpacing)) continue;
selected.push(candidate);
if (selected.length >= targetCount) break;
}
for (const placement of selected) {
placement.scale = (meshIndex === 0 ? 0.42 : 0.30) + placement.score * (meshIndex === 0 ? 0.28 : 0.20);
mountainPlacements.push(placement);
}
}

const treeCount = sideTreeCount + mountainPlacements.length;
const branchesPerTree = 5;
const leavesPerTree = 22;
const trunkGeo = new THREE.CylinderGeometry(0.42, 0.62, 1, 7);
const branchGeo = new THREE.CylinderGeometry(0.10, 0.23, 1, 6);
const leafGeo = new THREE.PlaneGeometry(1.15, 1.85);
const trunks = new THREE.InstancedMesh(trunkGeo, materials.assetTreeBark, treeCount);
const branches = new THREE.InstancedMesh(branchGeo, materials.assetTreeBark, treeCount * branchesPerTree);
const leaves = new THREE.InstancedMesh(leafGeo, materials.assetTreeLeaf, treeCount * leavesPerTree);
const dummy = new THREE.Object3D();
const up = new THREE.Vector3(0, 1, 0);
let branchIndex = 0;
let leafIndex = 0;
let randomState = 918273;
const random = () => {
randomState = (randomState * 1664525 + 1013904223) >>> 0;
return randomState / 4294967296;
};

for (let i = 0; i < treeCount; i++) {
const isMountainTree = i >= sideTreeCount;
const onLeft = !isMountainTree && i < leftCount;
const placement = isMountainTree ? mountainPlacements[i - sideTreeCount] : null;
const x = placement ? placement.x : (onLeft ? -24 - random() * 44 : 23.5 + random() * 8.5);
const z = placement ? placement.z : -190 + random() * 380;
const rootY = placement ? placement.y : getCliffTerrainHeight(x, z);
const treeScale = placement ? placement.scale : (onLeft ? 0.72 : 0.58) + random() * (onLeft ? 0.72 : 0.48);
const height = (7.8 + random() * 3.8) * treeScale;
const crownY = rootY + height * 0.68;

dummy.position.set(x, rootY + height * 0.5, z);
dummy.scale.set(treeScale, height, treeScale);
dummy.rotation.set(0, random() * Math.PI * 2, (random() - 0.5) * 0.055);
dummy.updateMatrix();
trunks.setMatrixAt(i, dummy.matrix);

for (let branch = 0; branch < branchesPerTree; branch++) {
const angle = random() * Math.PI * 2 + branch * 1.35;
const startY = rootY + height * (0.46 + branch * 0.075);
const length = (2.5 + random() * 2.2) * treeScale;
const direction = new THREE.Vector3(Math.cos(angle) * 0.72, 0.64 + random() * 0.24, Math.sin(angle) * 0.72).normalize();
const start = new THREE.Vector3(x, startY, z);
const end = start.clone().addScaledVector(direction, length);
dummy.position.copy(start).add(end).multiplyScalar(0.5);
dummy.quaternion.setFromUnitVectors(up, direction);
dummy.scale.set(treeScale, length, treeScale);
dummy.updateMatrix();
branches.setMatrixAt(branchIndex++, dummy.matrix);
}

for (let leaf = 0; leaf < leavesPerTree; leaf++) {
const angle = random() * Math.PI * 2;
const radial = Math.sqrt(random());
const crownRadius = (2.8 + random() * 1.25) * treeScale;
dummy.position.set(
x + Math.cos(angle) * radial * crownRadius,
crownY + (random() - 0.38) * height * 0.44,
z + Math.sin(angle) * radial * crownRadius
);
const leafScale = (0.62 + random() * 0.72) * treeScale;
dummy.scale.set(leafScale, leafScale, leafScale);
dummy.rotation.set((random() - 0.5) * 0.48, random() * Math.PI * 2, (random() - 0.5) * 0.36);
dummy.updateMatrix();
leaves.setMatrixAt(leafIndex++, dummy.matrix);
}
}

trunks.castShadow = true;
branches.castShadow = true;
leaves.castShadow = false;
forest.add(trunks, branches, leaves);
return forest;
}

function getForestGroundHeight(x, z) {
return Math.sin(z * 0.031 + x * 0.052) * 0.18 + Math.sin(z * 0.079 - x * 0.11) * 0.10;
}

function createForestGroundGeometry() {
const geometry = new THREE.PlaneGeometry(112, 400, 28, 96);
const position = geometry.attributes.position;
const colors = new Float32Array(position.count * 3);
const color = new THREE.Color();
for (let i = 0; i < position.count; i++) {
const x = position.getX(i);
const z = position.getY(i);
const height = getForestGroundHeight(x, z);
position.setZ(i, height);
const edge = Math.min(1, Math.max(0, (Math.abs(x) - 17) / 28));
const variation = Math.sin(x * 0.41 + z * 0.08) * 0.025;
color.setRGB(0.24 - edge * 0.12 + variation, 0.20 + edge * 0.12 + variation, 0.13 - edge * 0.045);
colors[i * 3] = color.r;
colors[i * 3 + 1] = color.g;
colors[i * 3 + 2] = color.b;
}
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
position.needsUpdate = true;
geometry.computeVertexNormals();
return geometry;
}

function prepareCourseInBackground(type) {
if (type === 'cave' && preparedCaveCourse) return;
if (type === 'cliff' && preparedCliffCourse) return;
if (type === 'forest' && preparedForestCourse) return;

const savedGround1 = ground1;
const savedGround2 = ground2;
const savedMaterials = courseOwnedMaterials;

if (type === 'cave') buildIceCaveCourse();
else if (type === 'cliff') buildCliffCourse();
else buildForestCourse();

const prepared = { ground1, ground2, materials: courseOwnedMaterials };
if (renderer && renderer.compile) {
renderer.compile(scene, camera);
const warmTarget = new THREE.WebGLRenderTarget(4, 4);
const previousTarget = renderer.getRenderTarget();
renderer.setRenderTarget(warmTarget);
renderer.render(scene, camera);
renderer.setRenderTarget(previousTarget);
warmTarget.dispose();
}
worldGroup.remove(prepared.ground1);
worldGroup.remove(prepared.ground2);
if (type === 'cave') preparedCaveCourse = prepared;
else if (type === 'cliff') preparedCliffCourse = prepared;
else preparedForestCourse = prepared;

ground1 = savedGround1;
ground2 = savedGround2;
courseOwnedMaterials = savedMaterials;
}

function scheduleCoursePreparation(type) {
const prepare = () => prepareCourseInBackground(type);
if (window.requestIdleCallback) window.requestIdleCallback(prepare, { timeout: 2500 });
else setTimeout(prepare, 900);
}

function activatePreparedCourse(type) {
const prepared = type === 'cave' ? preparedCaveCourse : (type === 'cliff' ? preparedCliffCourse : preparedForestCourse);
if (!prepared) {
if (type === 'cave') buildIceCaveCourse();
else if (type === 'cliff') buildCliffCourse();
else buildForestCourse();
return;
}
ground1 = prepared.ground1;
ground2 = prepared.ground2;
courseOwnedMaterials = prepared.materials;
worldGroup.add(ground1);
worldGroup.add(ground2);
if (type === 'cave') preparedCaveCourse = null;
else if (type === 'cliff') preparedCliffCourse = null;
else preparedForestCourse = null;
}

function setCaveObstaclePool(enabled) {
const index = sideTypes.indexOf('mineCart');
if (enabled && index === -1) sideTypes.push('mineCart');
if (!enabled && index !== -1) sideTypes.splice(index, 1);
}

function disposeObstacleMesh(mesh) {
if (!mesh) return;
const sharedMaterials = new Set([matCoin, matSnow, matRampRed, matRail, matRailGlow, matForestObstacleBark, matForestObstacleLeaf].filter(Boolean));
const disposedGeometries = new Set();
const disposedMaterials = new Set();
mesh.traverse(obj => {
if (obj.geometry && obj.geometry.dispose && !disposedGeometries.has(obj.geometry)) {
disposedGeometries.add(obj.geometry);
obj.geometry.dispose();
}
const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
for (const material of materials) {
if (!material || sharedMaterials.has(material) || disposedMaterials.has(material)) continue;
disposedMaterials.add(material);
material.dispose();
}
});
}

function removeObstacleAt(index) {
const obs = obstacles[index];
if (!obs) return;
worldGroup.remove(obs.mesh);
disposeObstacleMesh(obs.mesh);
obstacles.splice(index, 1);
}

function clearObstaclesForCourseChange() {
for (const obs of obstacles) {
worldGroup.remove(obs.mesh);
disposeObstacleMesh(obs.mesh);
}

}

function updateZiplineRide(delta) {
ziplineRideTime += Math.min(delta, 0.05);
const duration = 6.2;
const progress = Math.min(1, ziplineRideTime / duration);
const grabProgress = Math.min(1, progress / 0.14);
const grabSmooth = grabProgress * grabProgress * (3 - 2 * grabProgress);
const travelRaw = Math.max(0, Math.min(1, (progress - 0.12) / 0.88));
const travel = travelRaw * travelRaw * (3 - 2 * travelRaw);
if (coursePortal) coursePortal.position.z = 2 + travel * (coursePortal.userData.ziplineTravel || 258);
const cableY = THREE.MathUtils.lerp(16.5, 5.2, travel);
const hangingY = cableY - 4.55;
playerY = THREE.MathUtils.lerp(basePlayerY, hangingY, grabSmooth);
playerX += (0 - playerX) * 0.18;

if (skeleton.root) {
skeleton.root.position.set(playerX, playerY, 0);
skeleton.root.rotation.set(-0.16 - travel * 0.13, 0, Math.sin(ziplineRideTime * 5.2) * 0.035);
}
if (skeleton.torso) skeleton.torso.rotation.set(-0.24, 0, Math.sin(ziplineRideTime * 4.4) * 0.08);
if (skeleton.board) skeleton.board.rotation.set(0.12 + travel * 0.12, 0, Math.sin(ziplineRideTime * 4.0) * 0.05);

const cameraTargetY = playerY + 8.7;
camera.position.x += (playerX - camera.position.x) * 0.16;
camera.position.y += (cameraTargetY - camera.position.y) * 0.16;
camera.position.z += (13.5 - camera.position.z) * 0.16;
camera.fov += (82 - camera.fov) * 0.08;
camera.updateProjectionMatrix();
camera.lookAt(playerX, playerY + 0.8, -42 - travel * 22);
renderer.render(scene, camera);

if (progress >= 1) switchToForestCourse();
}

function updateCrashPieces() {
if (!isCrashed || !crashImpact) return;

crashImpact.frame++;
const f = crashImpact.frame;
const dir = crashImpact.fallSide;
const cx = crashImpact.startX;

// Kamera sabit; karakter yerinde kalsın ama kök parça biraz yana/alta devrilsin.
let rootOffsetX = 0;
let rootY = crashImpact.startY;
let rootRotX = crashImpact.rootX;
let rootRotY = crashImpact.rootY;
let rootRotZ = crashImpact.rootZ;
let boardRotX = crashImpact.boardX;
let boardRotY = crashImpact.boardY;
let boardRotZ = crashImpact.boardZ;
let boardPosY = crashImpact.boardPosY;
let torsoRotX = crashImpact.torsoX;
let torsoRotY = crashImpact.torsoY;
let torsoRotZ = crashImpact.torsoZ;
let torsoPosY = crashImpact.torsoPosY;
let modelRotX = crashImpact.modelRotX;
let modelRotZ = crashImpact.modelRotZ;
let modelScaleY = crashImpact.modelScaleY;

// FAZ 1: sert çarpışma, kısa hit-stop ve geri sekme
if (f <= 10) {
const t = f / 10;
const hit = Math.sin(t * Math.PI);
const recoil = Math.sin(t * Math.PI * 0.7);
rootY = crashImpact.startY - 0.02 * hit;
rootRotX = crashImpact.rootX - 0.92 * hit;
rootRotY = crashImpact.rootY + 0.08 * dir * recoil;
rootRotZ = crashImpact.rootZ + 0.34 * dir * hit;
boardRotX = crashImpact.boardX + 0.55 * hit;
boardRotY = crashImpact.boardY + 0.12 * dir * hit;
boardRotZ = crashImpact.boardZ - 0.95 * dir * hit;
boardPosY = crashImpact.boardPosY - 0.04 * hit;
torsoRotX = crashImpact.torsoX + 0.95 * hit;
torsoRotY = crashImpact.torsoY - 0.10 * dir * hit;
torsoRotZ = crashImpact.torsoZ - 0.36 * dir * hit;
torsoPosY = crashImpact.torsoPosY - 0.20 * hit;
modelRotX = 0.12 * hit;
modelRotZ = -0.12 * dir * hit;
modelScaleY = crashImpact.modelScaleY - 0.10 * hit;
if (skeleton.root) {
skeleton.root.position.set(cx + (Math.random()-0.5) * 0.03, rootY + (Math.random()-0.5)*0.015, 0);
}
}
// FAZ 2: denge kaybı, yana savrulup çökmeye başlar
else if (f <= 30) {
const t = (f - 10) / 20;
const ease = t * t * (3 - 2 * t);
rootOffsetX = 0.08 * dir * ease;
rootY = crashImpact.startY - 0.20 * ease;
rootRotX = -0.55 - 0.38 * ease;
rootRotY = 0.06 * dir * (1 - ease);
rootRotZ = (0.22 + 0.62 * ease) * dir;
boardRotX = 0.25 + 0.85 * ease;
boardRotY = 0.10 * dir;
boardRotZ = (-0.35 - 1.00 * ease) * dir;
boardPosY = -0.12 - 0.05 * ease;
torsoRotX = 0.50 + 0.62 * ease;
torsoRotY = -0.08 * dir;
torsoRotZ = (-0.20 - 0.70 * ease) * dir;
torsoPosY = -0.18 - 0.12 * ease;
modelRotX = 0.18 + 0.25 * ease;
modelRotZ = -0.16 * dir - 0.15 * dir * ease;
modelScaleY = 0.62 - 0.06 * ease;
}
// FAZ 3: yere komik kapaklanma + küçük sekme
else if (f <= 56) {
const t = (f - 30) / 26;
const ease = t * t * (3 - 2 * t);
const bounce = Math.sin(t * Math.PI) * 0.06;
rootOffsetX = (0.08 + 0.12 * ease) * dir;
rootY = Math.max(0.15, 0.26 - 0.10 * ease + bounce);
rootRotX = -0.95 - 0.38 * ease;
rootRotY = 0;
rootRotZ = (0.84 + 0.48 * ease) * dir;
boardRotX = 1.05 - 0.18 * ease;
boardRotY = 0;
boardRotZ = (-1.18 - 0.20 * ease) * dir;
boardPosY = -0.18 - 0.03 * ease;
torsoRotX = 1.00 - 0.15 * ease;
torsoRotY = 0;
torsoRotZ = (-0.76 - 0.22 * ease) * dir;
torsoPosY = -0.30;
modelRotX = 0.35;
modelRotZ = -0.22 * dir;
modelScaleY = 0.54;
}
// FAZ 4: yerde komik flop ve titreşerek durma
else {
const t = Math.min(1, (f - 56) / 45);
const settle = 1 - t;
const flop = Math.sin((f - 56) * 0.50) * 0.08 * settle;
rootOffsetX = (0.20 + 0.03 * flop) * dir;
rootY = 0.16 + Math.abs(Math.sin((f - 56) * 0.35)) * 0.018 * settle;
rootRotX = -1.28 + Math.abs(flop) * 0.10;
rootRotY = 0;
rootRotZ = ((1.28 * dir) + flop) ;
boardRotX = 0.92 + Math.abs(flop) * 0.18;
boardRotY = 0;
boardRotZ = ((-1.32 * dir) - flop);
boardPosY = -0.19;
torsoRotX = 0.86 + Math.abs(flop) * 0.16;
torsoRotY = 0;
torsoRotZ = ((-0.56 * dir) + flop);
torsoPosY = -0.32;
modelRotX = 0.28 + flop * 0.25;
modelRotZ = (-0.18 * dir) + flop * 0.15;
modelScaleY = 0.56 + Math.abs(flop) * 0.02;
}

const mode = crashImpact.mode || 'default';
if (mode === 'headHit') {
// Eğilme engeline kafayı vurdu: geriye/öne komik katlanma.
rootRotX += 0.22;
torsoRotX += 0.42;
torsoPosY -= 0.05;
modelScaleY = Math.max(0.48, modelScaleY - 0.04);
} else if (mode === 'frontCrash') {
// Zıplama engeline takıldı: öne kapaklanma hissi.
rootRotX -= 0.45;
boardRotX += 0.30;
torsoRotX += 0.26;
rootOffsetX *= 0.35;
} else if (mode === 'sideCrash') {
// Sağ/sol engeline çarptı: yana savrulma.
rootOffsetX += 0.16 * dir;
rootRotZ += 0.38 * dir;
torsoRotZ += 0.30 * dir;
boardRotZ -= 0.28 * dir;
}

playerX = cx;
playerY = rootY;
if (skeleton.root) {
skeleton.root.position.set(cx + rootOffsetX, rootY, 0);
skeleton.root.rotation.x = rootRotX;
skeleton.root.rotation.y = rootRotY;
skeleton.root.rotation.z = rootRotZ;
}
if (skeleton.board) {
skeleton.board.rotation.x = boardRotX;
skeleton.board.rotation.y = boardRotY;
skeleton.board.rotation.z = boardRotZ;
skeleton.board.position.y = boardPosY;
}
if (skeleton.torso) {
skeleton.torso.rotation.x = torsoRotX;
skeleton.torso.rotation.y = torsoRotY;
skeleton.torso.rotation.z = torsoRotZ;
skeleton.torso.position.y = torsoPosY;
}
if (robotModelRef) {
robotModelRef.rotation.x = modelRotX;
robotModelRef.rotation.z = modelRotZ;
robotModelRef.scale.y = modelScaleY;
}

if (crashCountdown > 0) {
crashCountdown--;
if (crashCountdown === 0) {
crashImpact = null;
endGame();
}
}
}
function endGame() {
isPlaying = false;
if (animationFrameId) cancelAnimationFrame(animationFrameId);
calculateScore();
document.getElementById('hud').style.display = 'none';
const breakdown = getScoreBreakdown();
document.getElementById('final-dist').innerText = 'Distance: ' + Math.floor(distance) + 'm';
document.getElementById('final-coins').innerText = 'Coins: ' + coins + '  |  Best Combo x' + bestCombo;
document.getElementById('go-score-value').innerText = breakdown.total;
document.getElementById('go-coins-value').innerText = coins;
const adBtn = document.getElementById('ad-continue-btn');
if (adBtn) {
  adBtn.disabled = false;
  adBtn.style.display = 'block';
}
document.getElementById('game-over-panel').style.display = 'block';
}



function resetPlayerPoseAfterRevive() {
  if (skeleton.root) {
    skeleton.root.visible = true;
    skeleton.root.position.set(playerX, basePlayerY, 0);
    skeleton.root.rotation.set(0, 0, 0);
  }
  if (skeleton.board) {
    skeleton.board.rotation.set(0, 0, 0);
    skeleton.board.position.y = -0.1;
  }
  if (skeleton.torso) {
    skeleton.torso.rotation.set(0, 0, 0);
    skeleton.torso.position.set(0, 0, 0);
  }
  if (robotModelRef) {
    robotModelRef.rotation.x = 0;
    robotModelRef.rotation.z = 0;
    robotModelRef.scale.set(0.7, 0.7, 0.7);
  }
  playAnim('idle');
}

function continueAfterAd() {
  document.getElementById('ad-overlay').style.display = 'none';
  document.getElementById('game-over-panel').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  reviveUsed = false;
  adPlaying = false;
  reviveInvulnFrames = 120;
  isPlaying = true;
  isCrashed = false;
  crashCountdown = 0;
  crashImpact = null;
  velocityY = 0;
  isJumping = false;
  isDucking = false;
  slideTimer = 0;
  playerY = basePlayerY;
  currentTrick = 'NONE';
  currentLane = Math.max(-1, Math.min(1, Math.round(playerX / laneWidth)));
  playerX = currentLane * laneWidth;
  if (Array.isArray(obstacles)) {
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      if (!obs || !obs.mesh) continue;
      const dz = obs.mesh.position.z - player.position.z;
      if (dz > -20 && dz < 40) {
        removeObstacleAt(i);
      }
    }
  }
  resetPlayerPoseAfterRevive();
  showTrickName('DEVAM!');
  if (clock) clock.getDelta();
  gameLoop();
}

function watchAdContinue() {
  if (adPlaying) return;
  const btn = document.getElementById('ad-continue-btn');
  const status = document.getElementById('ad-status');
  adPlaying = true;
  if (btn) btn.disabled = true;
  document.getElementById('ad-overlay').style.display = 'flex';
  status.textContent = 'Reklam hazırlanıyor...';
  setTimeout(() => { status.textContent = 'Reklam oynatılıyor...'; }, 650);
  setTimeout(() => { status.textContent = 'Ödül alındı, piste dönülüyor...'; }, 1900);
  setTimeout(() => { continueAfterAd(); }, 2750);
}

function createGrindRail(railType) {
const group = new THREE.Group();
group.userData.railType = railType || 'small';
group.userData.railLength = 240;

let railLength = 240;
let railHeight = 1.15;
let radius = 0.14;
let glowScale = 0.055;
let endRamp = false;

if (railType === 'mid') {
railHeight = 2.65;
radius = 0.17;
glowScale = 0.07;
} else if (railType === 'big') {
railHeight = 5.6;
radius = 0.20;
glowScale = 0.085;
endRamp = true;
}

group.userData.railLength = railLength;
const railGeo = new THREE.CylinderGeometry(radius, radius, railLength, 18);
const rail = new THREE.Mesh(railGeo, matRail);
rail.rotation.x = Math.PI / 2;
rail.position.set(0, railHeight, -railLength/2 + 18);
rail.castShadow = true;
rail.receiveShadow = true;
group.add(rail);

const glowGeo = new THREE.CylinderGeometry(glowScale, glowScale, railLength + 0.5, 12);
const glow = new THREE.Mesh(glowGeo, matRailGlow);
glow.rotation.x = Math.PI / 2;
glow.position.set(0, railHeight + radius + 0.04, -railLength/2 + 18);
group.add(glow);

const legGeo = new THREE.CylinderGeometry(0.08, 0.12, railHeight, 10);
for (let i=0; i<18; i++) {
const leg = new THREE.Mesh(legGeo, matRail);
leg.position.set(0, railHeight/2, 8 - i * 28);
leg.castShadow = true;
group.add(leg);
}

if (railType === 'mid' || railType === 'big') {
const lipGeo = new THREE.BoxGeometry(4.5, 0.35, 8.5);
const lip = new THREE.Mesh(lipGeo, matSnow);
lip.position.set(0, railHeight - 0.55, 16);
lip.rotation.x = -0.18;
lip.castShadow = true;
lip.receiveShadow = true;
group.add(lip);
}

if (endRamp) {
const rampGeo = new THREE.BoxGeometry(5.2, 1.2, 16);
const endRampMesh = new THREE.Mesh(rampGeo, matSnow);
endRampMesh.position.set(0, railHeight - 0.25, -railLength + 42);
endRampMesh.rotation.x = 0.22;
endRampMesh.castShadow = true;
endRampMesh.receiveShadow = true;
group.add(endRampMesh);
}

for(let i=0; i<3; i++) {
const arrow = createRedArrow();
arrow.scale.set(0.65, 0.65, 0.65);
arrow.position.set(0, railHeight + 0.25, 12 - i * 2.4);
arrow.children.forEach(c => c.material = matRailGlow);
group.add(arrow);
}
return group;
}

function getScoreBreakdown() {
const distanceScore = Math.floor(distance);
const airScore = Math.floor(airDistanceBonus);
const trickScore = Math.floor(trickScoreTotal);
const comboScore = Math.floor(comboScoreTotal + (bestCombo * 30));
const coinScore = Math.floor(coinScoreTotal + (coins * 15));
const total = distanceScore + airScore + trickScore + comboScore + coinScore;
return { distanceScore, airScore, trickScore, comboScore, coinScore, total };
}

function calculateScore() {
const breakdown = getScoreBreakdown();
score = breakdown.total;
bonusScore = breakdown.trickScore + breakdown.comboScore + breakdown.coinScore;
return score;
}

function isPlayerAboveObstacle(obs, spec) {
const top = (obs && obs.clearTop !== undefined) ? obs.clearTop : (spec.top || obs.hitY || 0);

// En önemli fix: oyuncu rampadan / yüksek zıplamadan engelin üstündeyse,
// X-Z alanına girse bile temas sayılmaz. Yüksekteyken "temassız geçiş" kabul edilir.
return playerY > top + margin;
}

function weightedPick(items) {
let total = 0;
for (const item of items) total += item.w;
let r = Math.random() * total;
for (const item of items) {
r -= item.w;
if (r <= 0) return item.v;
}
return items[items.length - 1].v;
}
function getDifficultyTier() {
// 5 kademeli zorluk sistemi:
// 0: rahat başlangıç
// 1: normal
// 2: combo başlar
// 3: yoğun refleks
// 4: hızlı/usta seviye
if (distance < 450) return 0;
if (distance < 1100) return 1;
if (distance < 2200) return 2;
if (distance < 3800) return 3;
return 4;
}

function getDifficultyName(tier) {
if (tier === 0) return 'EASY';
if (tier === 1) return 'NORMAL';
if (tier === 2) return 'HARD';
if (tier === 3) return 'EXTREME';
return 'INSANE';
}

function updateDifficulty() {
difficultyTier = getDifficultyTier();

// Böylece oyun başta okunabilir, ileride daha hızlı olur.
const targetSpeed = Math.min(2.35, baseSpeed + (distance * 0.00023) + (difficultyTier * 0.06));
speed += (targetSpeed - speed) * 0.012;
}

function spawnCoinLine(openLane, zStart, count) {

function makeCoinTrail(lane, zStart, count, step) {
const arr = [];
for (let i = 0; i < count; i++) {
arr.push({ type: 'coin', lane: lane, z: zStart - (i * (step || 16)) });
}
return arr;
}

function addGuideCoinsToPattern(pattern) {
const out = pattern.slice();

for (const item of pattern) {
if (item.type === 'ramp') {
out.push(...makeCoinTrail(item.lane, item.z + 48, 3, 14));
}
}

// İki şerit kapalıysa açık yolu coinlerle göster.
const byZ = {};
for (const item of pattern) {
const spec = getObstacleSpec(item.type);
if (spec.kind === 'side') {
const key = String(Math.round(item.z / 20) * 20);
if (!byZ[key]) byZ[key] = [];
byZ[key].push(item.lane);
}
}
for (const key in byZ) {
const lanes = byZ[key];
if (lanes.length >= 2) {
const open = [-1,0,1].find(v => !lanes.includes(v));
const z = parseInt(key, 10);
out.push(...makeCoinTrail(open, z + 18, 3, 15));
}
}

// Tek büyük engelde coinler güvenli şeride yönlendirsin.
for (const item of pattern) {
const spec = getObstacleSpec(item.type);
if (spec.kind === 'side') {
out.push({ type: 'coin', lane: otherLane(item.lane), z: item.z + 26 });
}
}

return out;
}

function createRuinsChunk(materials) {
const chunk = new THREE.Group();
const dummy = new THREE.Object3D();

// --- Zemin: taş döşeme (derzli) + kar lekeleri ---
const g = new THREE.PlaneGeometry(150, 400, 30, 100);
const p = g.attributes.position;
const cols = new Float32Array(p.count * 3); const c = new THREE.Color();
for (let i = 0; i < p.count; i++) {
const x = p.getX(i), z = p.getY(i); const nz = (z + 200) / 25;
let h = Math.sin(z * 0.04) * 0.05 + Math.sin(x * 0.25) * 0.03;
if (Math.abs(x) > 22) h += (Math.abs(x) - 22) * 0.04;
p.setZ(i, h);
const grid = (Math.abs(Math.sin(x * 0.5)) < 0.12 || Math.abs(Math.sin(z * 0.5)) < 0.12) ? 0.82 : 1.0;
const snow = cFbm(x * 0.04, nz, 4.4) > 0.55;
let r, gg, b;
if (snow) { r = 0.9; gg = 0.93; b = 0.97; }
else { const base = 0.62 * grid; r = base * 0.98; gg = base * 0.92; b = base * 0.78; }
c.setRGB(r, gg, b); cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
}
g.setAttribute('color', new THREE.BufferAttribute(cols, 3)); p.needsUpdate = true; g.computeVertexNormals();
const ground = new THREE.Mesh(g, materials.ground); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; chunk.add(ground);

// --- Kolonad: yolun iki yanında dev sütun sırası (klonlanır) ---
const colBases = [makeRuinColumn(materials, 9, false), makeRuinColumn(materials, 11.5, false), makeRuinColumn(materials, 7, true)];
for (const side of [-1, 1]) for (let i = 0; i < 6; i++) {
const b = colBases[Math.floor(Math.random() * colBases.length)].clone();
b.position.set(side * 17, 0, -190 + i * 64 + (Math.random() - 0.5) * 10);
b.rotation.y = Math.random() * 0.12;
b.scale.setScalar(0.9 + Math.random() * 0.4);
chunk.add(b);
}
// devrik sütunlar (yatan)
for (let i = 0; i < 3; i++) {
const side = i % 2 ? 1 : -1;
const fallen = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.1, 8 + Math.random() * 4, 12), materials.stone);
fallen.rotation.z = Math.PI / 2; fallen.rotation.y = Math.random() * Math.PI;
fallen.position.set(side * (20 + Math.random() * 8), 1.0, (Math.random() - 0.5) * 360); fallen.castShadow = true; chunk.add(fallen);
}

// --- Kolosal muhafız heykelleri ---
const statueBase = makeRuinStatue(materials);
for (let i = 0; i < 2; i++) {
const side = i % 2 ? 1 : -1;
const st = statueBase.clone();
st.position.set(side * 26, 0, -80 + i * 160);
st.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
st.scale.setScalar(1.0 + Math.random() * 0.3);
chunk.add(st);
}

// --- Dev anıtsal kapı (ara sıra, yolun üstünden geçilir) ---
if (Math.random() < 0.5) {
const gate = makeRuinGate(materials);
gate.position.set(0, 0, -100 + Math.random() * 200);
chunk.add(gate);
}

// --- Ateş mangalları (yanan alev) ---
for (let i = 0; i < 6; i++) {
const side = i % 2 ? 1 : -1;
const br = makeRuinBrazier(materials);
br.position.set(side * 14.5, 0, -180 + i * 72);
chunk.add(br);
}

// --- Moloz (instanced) ---
const rubble = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 0.8, 1.2), materials.stoneDark, 30);
for (let i = 0; i < 30; i++) {
const side = i % 2 ? 1 : -1;
dummy.position.set(side * (15 + Math.random() * 30), 0.4, (Math.random() - 0.5) * 390);
dummy.scale.set(0.6 + Math.random() * 1.6, 0.6 + Math.random() * 1.2, 0.6 + Math.random() * 1.6);
dummy.rotation.set(Math.random(), Math.random() * Math.PI, Math.random()); dummy.updateMatrix();
rubble.setMatrixAt(i, dummy.matrix);
}
rubble.castShadow = true; rubble.frustumCulled = false; chunk.add(rubble);

// --- Uzak karlı dağlar ---
addBackdropMountains(chunk, materials.peak);
return chunk;
}

// Prosedürel kaya dokusu (canvas): gürültü + yatay tabaka + çatlaklar.
// bumpMap olarak kullanılınca düz kaya, ışık altında gerçek girinti-çıkıntı kazanır.
function createProceduralRockTexture() {
const c = document.createElement('canvas');
c.width = 256; c.height = 256;
const ctx = c.getContext('2d');
ctx.fillStyle = '#9a9088';
ctx.fillRect(0, 0, 256, 256);
const img = ctx.getImageData(0, 0, 256, 256);
const d = img.data;
for (let i = 0; i < d.length; i += 4) {
const n = (Math.random() - 0.5) * 64;
d[i] = Math.max(0, Math.min(255, d[i] + n));
d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
}
ctx.putImageData(img, 0, 0);
for (let y = 0; y < 256; y += 6 + Math.random() * 12) {
ctx.fillStyle = 'rgba(40,34,28,' + (0.05 + Math.random() * 0.10).toFixed(2) + ')';
ctx.fillRect(0, y, 256, 1 + Math.random() * 3);
}
ctx.strokeStyle = 'rgba(20,16,12,0.35)';
for (let i = 0; i < 32; i++) {
ctx.lineWidth = Math.random() * 1.5;
ctx.beginPath();
let x = Math.random() * 256, y = Math.random() * 256;
ctx.moveTo(x, y);
for (let s = 0; s < 5; s++) { x += (Math.random() - 0.5) * 42; y += (Math.random() - 0.5) * 42; ctx.lineTo(x, y); }
ctx.stroke();
}
const tex = new THREE.CanvasTexture(c);
tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
tex.repeat.set(8, 14);
return tex;
}

// Kanyon gürültüsü: döşenebilir (z'de periyodik) value-noise fbm.
function cHash(ix, iz, seed) {
const v = Math.sin(ix * 127.1 + iz * 311.7 + seed * 74.7) * 43758.5453;
return v - Math.floor(v);
}
function cNoise(x, z, seed, period) {
const x0 = Math.floor(x), z0 = Math.floor(z);
const tx = x - x0, tz = z - z0;
const sx = tx * tx * (3 - 2 * tx), sz = tz * tz * (3 - 2 * tz);
const wrap = v => ((v % period) + period) % period;
const a = cHash(x0, wrap(z0), seed), b = cHash(x0 + 1, wrap(z0), seed);
const c = cHash(x0, wrap(z0 + 1), seed), d = cHash(x0 + 1, wrap(z0 + 1), seed);
return THREE.MathUtils.lerp(THREE.MathUtils.lerp(a, b, sx), THREE.MathUtils.lerp(c, d, sx), sz);
}
function cFbm(x, z, seed) {
let val = 0, amp = 0.55, freq = 1;
for (let o = 0; o < 4; o++) { val += cNoise(x * freq, z * freq, seed + o * 5.1, 16 * freq) * amp; freq *= 2; amp *= 0.5; }
return val;
}
// Temple Run mantığı: köprüde kırık şerit bölümleri. Belirli z aralıklarında
// bir şerit (sol/orta/sağ) eksik olur -> oyuncu mecbur diğer şeride geçer.
// Desen z'de 80 birim periyotlu (400/80=5) -> parçalar arasında döşenebilir.
function canyonGap(x, z) {
const lane = x < -4 ? -1 : (x > 4 ? 1 : 0);
const local = (((z + 200) % 80) + 80) % 80;
if (local < 22) {
const seg = Math.floor(((((z + 200) % 400) + 400) % 400) / 80); // 0..4
const broken = (seg % 3) - 1;   // -1,0,1 döngü
if (lane === broken) return true;
}
return false;
}
// Kanyon yüksekliği: ortada karlı köprü (kırık bölümler uçuruma düşer);
// yanlarda dik buz gorge + çok-oktavlı keskin sırtlı duvarlar. z'de döşenebilir.
function getCanyonHeight(x, z) {
const ax = Math.abs(x);
const nz = (z + 200) / 25;
const trackWave = Math.sin(z * 0.03) * 0.05;
if (ax < 15) {
if (canyonGap(x, z)) return -60 + cFbm(x * 0.1, nz, 9.2) * 4;   // kırık şerit: boşluk
return trackWave + Math.sin(x * 0.4 + z * 0.05) * 0.05;
}
let base;
if (ax < 38) base = -Math.pow((ax - 15) / 23, 0.7) * 70;
else base = -70 + Math.pow(ax - 38, 1.12) * 0.9;
const amp = Math.min(1, (ax - 15) / 26);
const broad = cFbm(x * 0.018, nz, 5.1);
const ridge = 1 - Math.abs(cFbm(x * 0.045, nz, 12.3) * 2 - 1);
const detail = cFbm(x * 0.11, nz, 21.7);
const rock = (broad * 9 + ridge * 15 + detail * 3.5) * amp;
return base + rock + trackWave;
}

function createSkyCanyonChunk(materials) {
const chunk = new THREE.Group();
const dummy = new THREE.Object3D();

// --- Tek parça kayalık kanyon arazisi (yüksek çözünürlük) ---
const geo = new THREE.PlaneGeometry(240, 400, 132, 116);
const pos = geo.attributes.position;
for (let i = 0; i < pos.count; i++) {
pos.setZ(i, getCanyonHeight(pos.getX(i), pos.getY(i)));
}
pos.needsUpdate = true;
geo.computeVertexNormals();
// Renk: eğim + yükseklik + derinlik. Kar düz ledge'lere birikir, dik yüz çıplak.
const nor = geo.attributes.normal;
const colors = new Float32Array(pos.count * 3);
const col = new THREE.Color();
for (let i = 0; i < pos.count; i++) {
const x = pos.getX(i);
const y = pos.getZ(i);                 // displaced yükseklik (plane henüz döndürülmedi)
const ax = Math.abs(x);
let r, g, b;
if (ax < 14 && y > -5) {
r = 0.84; g = 0.89; b = 0.97;        // köprü karı (beyaz-mavi)
} else {
const slope = Math.min(1, Math.max(0, 1 - nor.getZ(i)));   // 0 düz, 1 dik
const h01 = Math.min(1, Math.max(0, (y + 70) / 120));
const depth01 = Math.min(1, Math.max(0, (-y) / 70));
// dikey buz olukları (striation): z boyunca değişir -> duvarda dikey çizgi
const flute = 0.92 + Math.sin(pos.getY(i) * 0.5 + cFbm(x * 0.04, (pos.getY(i) + 200) / 25, 3.3) * 3) * 0.07;
// buz mavisi taban: yüksekte açık, derinde koyu lacivert
let rr = 0.50 + h01 * 0.30 - depth01 * 0.30;
let gg = 0.60 + h01 * 0.30 - depth01 * 0.22;
let bb = 0.72 + h01 * 0.26 - depth01 * 0.10;
const shade = (1 - slope * 0.22) * flute;   // dik yüz + oluk gölgesi
rr *= shade; gg *= shade; bb *= shade;
const snow = Math.min(1, Math.max(0, (h01 - 0.5) / 0.3)) * Math.min(1, Math.max(0, 1 - slope * 1.8));
rr += (0.96 - rr) * snow; gg += (0.97 - gg) * snow; bb += (1.0 - bb) * snow;
r = rr; g = gg; b = bb;
}
col.setRGB(Math.max(0, r), Math.max(0, g), Math.min(1, Math.max(0, b)));
colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
}
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const terrain = new THREE.Mesh(geo, materials.rock);
terrain.rotation.x = -Math.PI / 2; terrain.receiveShadow = true; terrain.castShadow = true;
chunk.add(terrain);

// --- Moloz/scree kayaları (yamaçlarda) ---
const scree = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), materials.darkRock, 44);
for (let i = 0; i < 44; i++) {
const side = i % 2 === 0 ? -1 : 1;
const x = side * (16 + Math.random() * 30);
const z = (Math.random() - 0.5) * 396;
const y = getCanyonHeight(x, -z);     // dünya z'si plane Y'sinin tersi (döndürme)
const sc = 0.6 + Math.random() * 2.2;
dummy.position.set(x, y + sc * 0.3, z);
dummy.scale.set(sc * 1.3, sc * (0.7 + Math.random() * 0.5), sc * 1.2);
dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
dummy.updateMatrix();
scree.setMatrixAt(i, dummy.matrix);
}
scree.castShadow = true; scree.frustumCulled = false;
chunk.add(scree);

// --- Köprü korkulukları (yüksek köprü hissi) ---
for (const side of [-1, 1]) {
for (let i = 0; i < 12; i++) {
const post = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.5, 0.22), materials.plank);

function createFrozenLakeChunk(materials) {
const chunk = new THREE.Group();
const dummy = new THREE.Object3D();

// --- Buz yüzeyi: düz, parlak; çatlak damarları vertex renklerine işlenir ---
const iceGeo = new THREE.PlaneGeometry(200, 400, 44, 110);
const ip = iceGeo.attributes.position;
const icolors = new Float32Array(ip.count * 3);
const icol = new THREE.Color();
const crackNoise = (x, z) => {
const a = Math.abs(Math.sin(x * 0.12 + Math.sin(z * 0.05) * 2.0));
const b = Math.abs(Math.sin(z * 0.09 + Math.sin(x * 0.04) * 2.0));
return Math.min(a, b);
};
for (let i = 0; i < ip.count; i++) {
const x = ip.getX(i), z = ip.getY(i);
let h = Math.sin(x * 0.05 + z * 0.03) * 0.04 + Math.sin(z * 0.02) * 0.03;
if (Math.abs(x) > 26) h += (Math.abs(x) - 26) * 0.07;
ip.setZ(i, h);
const center = 1 - Math.min(1, Math.abs(x) / 70);
// Gerçek mavi buz: koyu camsı teal-mavi; merkez biraz daha açık, kenarlar daha derin.
const tone = Math.sin(x * 0.08 + z * 0.05) * 0.03;
let r = 0.13 + center * 0.10 + tone;
let g = 0.42 + center * 0.16 + tone;
let b = 0.62 + center * 0.20 + tone;
if (Math.abs(x) > 26) { r = 0.72; g = 0.79; b = 0.9; }      // kıyı karı (gölgeli, patlamayan)
else if (crackNoise(x, z) < 0.04) { r *= 0.45; g *= 0.5; b *= 0.66; }  // çatlak: koyu lacivert damar
icol.setRGB(r, g, Math.min(1, b));
icolors[i * 3] = icol.r; icolors[i * 3 + 1] = icol.g; icolors[i * 3 + 2] = icol.b;
}
iceGeo.setAttribute('color', new THREE.BufferAttribute(icolors, 3));
ip.needsUpdate = true; iceGeo.computeVertexNormals();
const ice = new THREE.Mesh(iceGeo, materials.ice);
ice.rotation.x = -Math.PI / 2; ice.receiveShadow = true;
chunk.add(ice);

// --- Belirgin yüzey çatlakları (ince koyu hatlar) ---
for (let i = 0; i < 6; i++) {
const crackLine = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.04, 20 + Math.random() * 30), materials.crack);
crackLine.position.set((Math.random() - 0.5) * 40, 0.06, (Math.random() - 0.5) * 360);
crackLine.rotation.y = Math.random() * Math.PI;
chunk.add(crackLine);
}

// --- Basınç buzulları (yukarı itilmiş buz blokları), kayış koridoru boş kalır ---
const ridge = new THREE.InstancedMesh(new THREE.OctahedronGeometry(1.0, 0), materials.iceBlock, 30);
for (let i = 0; i < 30; i++) {
const side = i % 2 === 0 ? -1 : 1;
const x = side * (15 + Math.random() * 28);
const z = (Math.random() - 0.5) * 390;
const sc = 0.5 + Math.random() * 1.4;
dummy.position.set(x, 0.2 * sc, z); dummy.scale.set(sc * 1.2, sc * 0.8, sc * 1.2); dummy.rotation.set(Math.random(), Math.random() * Math.PI, Math.random()); dummy.updateMatrix();
ridge.setMatrixAt(i, dummy.matrix);
}
ridge.castShadow = true; ridge.frustumCulled = false; chunk.add(ridge);

// --- İnce buz dikitleri (shard) ---
const shards = new THREE.InstancedMesh(new THREE.TetrahedronGeometry(0.8, 0), materials.iceBlock, 26);
for (let i = 0; i < 26; i++) {
const side = i % 2 === 0 ? -1 : 1;

const z = (Math.random() - 0.5) * 392;

// --- Karlı kıyı çamları ---

// --- Uzak gerçekçi karlı dağlar (kaya tabanı + kar capli, düzensiz silüet) ---

// Tek bir dağ evi (chalet). Rastgele ölçülerle üretilir, klonlanarak çeşitlenir.
function createChalet(materials) {
const g = new THREE.Group();
const w = 5.4 + Math.random() * 1.8;
const h = 3.6 + Math.random() * 1.2;
const d = 6.0 + Math.random() * 1.8;

body.position.y = h / 2;
body.castShadow = true; body.receiveShadow = true;
g.add(body);
// köşe kirişleri
const beamGeo = new THREE.BoxGeometry(0.28, h, 0.28);
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
const beam = new THREE.Mesh(beamGeo, materials.beam);
beam.position.set(sx * (w / 2 - 0.14), h / 2, sz * (d / 2 - 0.14));
g.add(beam);
}
// karlı çatı (4 yüzlü)
const roofH = 2.4 + Math.random() * 0.8;
const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.76, roofH, 4), materials.snowRoof);
roof.rotation.y = Math.PI / 4;
roof.position.y = h + roofH / 2 - 0.15;
roof.castShadow = true;
g.add(roof);
// saçak
const eave = new THREE.Mesh(new THREE.BoxGeometry(w + 0.6, 0.25, d + 0.6), materials.beam);
eave.position.y = h - 0.02;
g.add(eave);
// baca
const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.5, 0.7), materials.chimney);
chimney.position.set(w * 0.22, h + roofH * 0.55, d * 0.18);
chimney.castShadow = true;
g.add(chimney);
g.userData.chimneyTop = new THREE.Vector3(w * 0.22, h + roofH * 0.55 + 1.0, d * 0.18);
// sıcak ışıklı pencereler (+x yüzü = "ön", piste bakacak şekilde yerleştirilir)
const winGeo = new THREE.BoxGeometry(0.14, 1.1, 1.0);
for (const wz of [-d * 0.22, d * 0.22]) {
const win = new THREE.Mesh(winGeo, materials.window);
win.position.set(w / 2 + 0.02, h * 0.5, wz);
g.add(win);
}
// kapı
const door = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.8, 1.0), materials.door);
door.position.set(w / 2 + 0.02, 0.9, 0);
g.add(door);
return g;
}

// Gerçekçi backdrop dağı: düzensiz silüet + kaya tabanı + tepede kar (vertex renkleri).
function createSnowyPeakGeometry(seed) {
const geo = new THREE.ConeGeometry(1, 2.0, 20, 14);
const pos = geo.attributes.position;
const colors = new Float32Array(pos.count * 3);
const col = new THREE.Color();
for (let i = 0; i < pos.count; i++) {
let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
const hN = (y + 1.0) / 2.0;                 // 0 taban .. 1 tepe
const ang = Math.atan2(z, x);
const rad = Math.sqrt(x * x + z * z);
// çok-oktavlı düzensizlik: büyük sırtlar + orta + ince detay (tepeye azalır)
let disp = 0, amp = 0.17, f = 1;
for (let o = 0; o < 4; o++) { disp += Math.sin(ang * (3 * f) + y * (2.5 * f) + seed * (o + 1.3)) * amp; amp *= 0.5; f *= 1.9; }
disp *= (1 - hN * 0.5);
if (rad > 0.001) { x += (x / rad) * disp; z += (z / rad) * disp; }
y += Math.sin(ang * 6 + seed) * 0.05 * (1 - hN);
pos.setXYZ(i, x, y, z);
// soğuk mavi-gri kaya (alt) -> kar (üst); tabaka deseni
const snow = Math.min(1, Math.max(0, (hN - 0.46) / 0.26));
const strata = 0.9 + Math.sin(y * 5.5 + x * 2) * 0.07;
let r = 0.40 * strata, g = 0.45 * strata, b = 0.55 * strata;
r += (0.97 - r) * snow; g += (0.98 - g) * snow; b += (1.0 - b) * snow;
col.setRGB(r, g, b);
colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
}
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
pos.needsUpdate = true; geo.computeVertexNormals();
return geo;
}

// Bir chunk'a, iki yanı saran gerçekçi karlı dağ silsilesini (instanced) ekler.
function addBackdropMountains(chunk, material) {
const dummy = new THREE.Object3D();
const geos = [createSnowyPeakGeometry(0.5), createSnowyPeakGeometry(2.1), createSnowyPeakGeometry(4.3)];
const perGeoSide = 6;
for (let g = 0; g < geos.length; g++) {
const im = new THREE.InstancedMesh(geos[g], material, perGeoSide * 2);
let n = 0;
for (let s = 0; s < 2; s++) {
const side = s === 0 ? -1 : 1;
for (let i = 0; i < perGeoSide; i++) {
const sX = 16 + Math.random() * 20;
const sY = 24 + Math.random() * 30;
const x = side * (70 + Math.random() * 95);
const z = -210 + (i / perGeoSide) * 420 + (Math.random() - 0.5) * 40;
dummy.position.set(x, 0.95 * sY - 3, z);
dummy.scale.set(sX, sY, sX * (0.8 + Math.random() * 0.4));
dummy.rotation.set(0, Math.random() * Math.PI, 0);
dummy.updateMatrix();
im.setMatrixAt(n++, dummy.matrix);
}
}
im.frustumCulled = false;
chunk.add(im);
}
}

function createSkyDome() {
const geo = new THREE.SphereGeometry(760, 32, 16);
const mat = new THREE.ShaderMaterial({
uniforms: {
topColor: { value: new THREE.Color(0x2f6fb0) },
bottomColor: { value: new THREE.Color(0xcfe4f2) },
offset: { value: 60 },
exponent: { value: 0.62 }
},
vertexShader: 'varying vec3 vWorldPosition; void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vWorldPosition = wp.xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
fragmentShader: 'uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vWorldPosition; void main(){ float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y; float f = pow(clamp(h, 0.0, 1.0), exponent); gl_FragColor = vec4(mix(bottomColor, topColor, f), 1.0); }',
side: THREE.BackSide,
depthWrite: false,
fog: false
});
const dome = new THREE.Mesh(geo, mat);
dome.renderOrder = -1;
dome.frustumCulled = false;
return dome;
}

function getBiomeForIndex(idx) {
const order = worldBiomes;
return order[Math.floor(idx / SEGMENT_CHUNKS) % order.length];
}

// Havuzdan boş parça al, yoksa bir kez üret. İlk turdan sonra hep yeniden kullanılır.
function acquireChunk(biome) {
let c = biome.pool.find(ch => !ch.userData.inUse);
if (!c) {
c = biome.makeChunk();
c.userData.biomeName = biome.name;
biome.pool.push(c);
}
c.userData.inUse = true;
return c;
}

function releaseChunk(c) {
if (!c) return;
c.userData.inUse = false;
if (c.parent) c.parent.remove(c);
}

function initUnifiedWorld() {
buildBiomeRegistry();
for (const ch of worldChunks) releaseChunk(ch);
worldChunks = [];
worldTravel = 0;
worldChunkCounter = 0;
// Eski (legacy) zemin parçaları sahnedeyse temizle.
if (ground1) { worldGroup.remove(ground1); ground1 = null; }
if (ground2) { worldGroup.remove(ground2); ground2 = null; }
for (let i = 0; i < ACTIVE_CHUNKS; i++) {
const biome = getBiomeForIndex(i);
const c = acquireChunk(biome);
c.position.set(0, 0, -i * CHUNK_LEN);
c.userData.index = i;
worldGroup.add(c);
worldChunks.push(c);
}
worldChunkCounter = ACTIVE_CHUNKS;
const first = getBiomeForIndex(0);
applyAtmosphere(first, first, 0);
prewarmBiomes();
}

// Diğer biome'ların ilk parçasını boş zamanda hazırla -> ilk geçişte kasma olmaz.
let biomesPrewarmed = false;

c.userData.inUse = false;
